[project]
name = "task-manager"
version = "1.0.0"
description = "Практическая работа 19–20: задание 4"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
task-manager = "task_manager.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_manager"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "build==1.2.2.post1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
